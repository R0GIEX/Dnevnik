<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дневник тренировок</title>
<style>
:root{--bg:#f3f4f1;--card:#fff;--chip:#e8eae4;--tx:#1c211b;--mut:#6b7468;--ac:#2f9e55;--acx:#fff;--bd:#dcdfd7;--dg:#d64545;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141714;--card:#1f2320;--chip:#2c312d;--tx:#eef1ec;--mut:#8f998c;--ac:#3fb56a;--acx:#0d1a11;--bd:#2f352f;--dg:#ef6a6a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141714;--card:#1f2320;--chip:#2c312d;--tx:#eef1ec;--mut:#8f998c;--ac:#3fb56a;--acx:#0d1a11;--bd:#2f352f;--dg:#ef6a6a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 "Trebuchet MS","Segoe UI",system-ui,sans-serif;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 12px 6px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav .arr{width:44px;height:44px;border-radius:12px;font-size:22px;color:var(--mut)}
.today{background:var(--ac);color:var(--acx);border-radius:14px;padding:10px 18px;font-weight:700;min-width:150px;text-align:center}
.today.past{background:var(--chip);color:var(--tx)}
.sum{text-align:center;color:var(--mut);margin:10px 0 6px;font-variant-numeric:tabular-nums}
.tags{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-weight:700;min-height:22px}
main{padding:8px 12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:12px;margin:10px 0;border-left:5px solid var(--gc)}.card.dragging{opacity:.55;outline:2px dashed var(--ac)}.drag-handle{width:34px;min-width:34px;height:40px;border-radius:10px;background:var(--chip);color:var(--mut);font-size:21px;touch-action:none;cursor:grab;user-select:none}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ch h3{margin:0;font-size:17px}.ch small{color:var(--mut)}
.ib{width:40px;height:40px;border-radius:12px;font-size:22px;background:var(--chip)}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.set{background:var(--chip);border-radius:12px;padding:6px 12px;text-align:left;font-variant-numeric:tabular-nums}
.set b{font-size:19px}.set span{color:var(--mut);font-size:13px}
.empty{text-align:center;color:var(--mut);margin:48px 16px}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none;align-items:flex-end}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-height:85%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
.sheet h2{margin:0 0 12px;font-size:19px}
.row{display:flex;align-items:center;gap:10px;margin:12px 0}
.row label{width:96px;color:var(--mut)}
.row input{flex:1;min-width:0;text-align:center;font:inherit;font-size:24px;font-weight:700;background:var(--chip);color:var(--tx);border:0;border-radius:12px;padding:10px}
.row .st{width:48px;height:48px;border-radius:12px;background:var(--chip);font-size:24px}
.btns{display:flex;gap:10px;margin-top:18px}
.btns button{flex:1;padding:14px;border-radius:14px;background:var(--chip);font-weight:700}
.btns .ok{background:var(--ac);color:var(--acx)}.btns .del{color:var(--dg)}
.grp{margin:14px 0 6px;font-weight:700}
.ex{display:block;width:100%;text-align:left;padding:12px;border-radius:12px;background:var(--chip);margin:6px 0}
.ex small{color:var(--mut)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--dg);color:#fff;padding:10px 16px;border-radius:12px;z-index:30;display:none}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gb{--gc:var(--bd);padding:22px 8px;border-radius:16px;background:var(--chip);font-weight:700;font-size:18px;border-bottom:4px solid var(--gc)}
.gb.has{--gc:var(--ac)}
.back{display:flex;align-items:center;gap:10px;margin-bottom:12px}.back button{width:44px;height:44px;border-radius:12px;background:var(--chip);font-size:22px}
.cm{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.cm .mt{font-weight:700;font-size:19px;padding:10px 14px;border-radius:12px;background:var(--chip)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{color:var(--mut);font-size:13px;padding:4px 0}
.cal button{height:44px;border-radius:12px;position:relative;font-variant-numeric:tabular-nums}
.cal .has::after{content:"";position:absolute;left:50%;bottom:4px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ac)}
.cal .sel{background:var(--ac);color:var(--acx);font-weight:700}.cal .sel::after{background:var(--acx)}
.cal .tdy{outline:2px solid var(--ac)}
.eff{display:flex;gap:8px;margin:6px 0}.ef{flex:1;padding:10px 4px;border-radius:12px;background:var(--chip);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}.ef i{width:10px;height:10px;border-radius:50%;background:var(--ec)}.ef.on{box-shadow:inset 0 0 0 2px var(--ec)}
.mk{display:block;height:14px;font-size:11px;line-height:14px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;flex:none}
.avb{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.pname{text-align:center;color:var(--mut);font-size:13px;margin-top:4px}.pname:empty{display:none}
.cdot{width:36px;height:36px;border-radius:50%;margin:4px}.cdot.on{outline:3px solid var(--tx);outline-offset:2px}
.nav .today{min-width:110px}
.tmb{color:var(--ac);font-weight:700;padding:3px 8px;border-radius:8px;background:var(--chip)}
.clock{font-size:64px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 10px}.clock.done{color:var(--ac)}
.cmt{display:block;margin:6px auto 0;color:var(--mut);font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 8px}
.rest{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:62px;padding:0 8px 0 18px;border-radius:20px;background:var(--card);color:var(--tx);box-shadow:0 6px 18px rgba(0,0,0,.3);display:none;align-items:center;gap:12px;font-weight:700;font-size:20px;z-index:6;font-variant-numeric:tabular-nums}.rest.done{background:var(--ac);color:var(--acx)}.rest button{width:44px;height:44px;border-radius:12px;font-size:18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.tile{background:var(--chip);border-radius:14px;padding:10px}.tile b{display:block;font-size:21px}.tile small{color:var(--mut)}
.chart{width:100%;height:auto;margin:6px 0}.chart .ln{stroke:var(--ac);fill:none;stroke-width:2.5;stroke-linejoin:round}.chart .dt{fill:var(--ac)}.chart .gr{stroke:var(--bd)}.chart text{fill:var(--mut);font-size:10px}
.tile{position:relative}.tile>small:first-of-type{display:block;padding-right:32px}.qi{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:var(--bd);color:var(--mut);font-weight:700}
.srow{padding:8px 0;border-bottom:1px solid var(--bd)}
.qs{width:24px;height:24px;border-radius:50%;background:var(--bd);color:var(--mut);font-weight:700;font-size:13px;margin-left:8px;vertical-align:middle}
.chart .bar{fill:var(--ac)}
.gbar{display:flex;align-items:center;gap:8px;margin:6px 0}.gbar span{width:84px;font-size:14px}.gtr{flex:1;height:10px;border-radius:5px;background:var(--chip)}.gtr i{display:block;height:100%;border-radius:5px}.gbar b{width:42px;text-align:right;font-size:14px}
.body{display:block;width:100%;height:auto;margin:8px 0;max-height:360px}.body .sil{fill:var(--chip);stroke:var(--bd);stroke-width:1.5;stroke-linejoin:round}.body .mu{stroke:var(--card);stroke-width:1.5;stroke-linejoin:round;opacity:1;transition:fill .18s ease}.body .mu[data-level="0"]{fill:var(--chip)}.body .mu[data-level="4"]{fill:#ef4444}.body .mu[data-level="3"]{fill:#f97316}.body .mu[data-level="2"]{fill:#facc15}.body .mu[data-level="1"]{fill:#22c55e}.body text{fill:var(--mut);font-size:12px}.mus-legend{display:flex;flex-wrap:wrap;gap:7px 12px;justify-content:center;margin:8px 0 14px;font-size:12px;color:var(--mut)}.mus-legend span{display:inline-flex;align-items:center;gap:5px}.mus-legend i{width:11px;height:11px;border-radius:3px;display:inline-block}.gtr i{transition:width .18s ease}
.hint{color:var(--mut);margin:-4px 0 8px;font-size:14px}
.exr{display:flex;gap:6px;align-items:stretch}.exr .ex{flex:1;width:auto}.star{width:48px;margin:6px 0;border-radius:12px;background:var(--chip);font-size:22px}
.q{width:100%;font:inherit;font-size:17px;background:var(--chip);color:var(--tx);border:0;border-radius:12px;padding:12px;margin-bottom:12px}
.row select{flex:1;min-width:0;font:inherit;font-size:17px;background:var(--chip);color:var(--tx);border:0;border-radius:12px;padding:12px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:8px;padding-bottom:4px}.chip{flex:none;padding:8px 14px;border-radius:20px;background:var(--chip)}.chip.on{background:var(--ac);color:var(--acx);font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<header>
 <div class="nav"><button class="arr" id="menubtn" aria-label="Меню">☰</button><span style="display:flex;align-items:center;gap:6px"><button class="today" id="today"></button><button class="avb" id="profbtn" aria-label="Дневники"></button></span><span style="display:flex"><button class="arr" id="timerbtn" aria-label="Таймер">⏱</button><button class="arr" id="calbtn" aria-label="Календарь">📅</button></span></div>
 <div class="pname" id="pname"></div><div class="sum" id="sum"></div><div class="tags" id="tags"></div><button class="cmt" id="cmt"></button><button class="cmt" id="mus" style="display:none">💪 Нагрузка на мышцы</button>
</header>
<main id="list"></main>
<button class="fab" id="add" aria-label="Добавить упражнение">+</button>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="rest" id="rest"></div>
<div class="toast" id="toast"></div>

<script id="core">
/*CORE*/
const Core=(()=>{
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const pad=n=>String(n).padStart(2,'0');
const dateKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const shiftDay=(k,n)=>{const [y,m,d]=k.split('-').map(Number);return dateKey(new Date(y,m-1,d+n));};
const DEF={theme:'auto',weekStart:1,keepAwake:false,timerSec:90,auto:false,sound:true,volume:3,sig:'bell',repeatAlarm:false,vibrate:true};
const emptyState=()=>({v:1,days:{},custom:[],fav:{},body:{},notes:[],settings:{...DEF}});
function parse(raw){try{const s=JSON.parse(raw);if(s&&s.v===1&&s.days&&typeof s.days==='object'&&!Array.isArray(s.days))return norm(s);}catch(e){}return emptyState();}
const getDay=(s,k)=>s.days[k]||(s.days[k]={entries:[]});
function addEntry(s,k,exId){const d=getDay(s,k);let e=d.entries.find(x=>x.exId===exId);if(!e){e={id:uid(),exId,sets:[]};d.entries.push(e);}return e;}
const findEntry=(s,k,id)=>(s.days[k]?s.days[k].entries:[]).find(e=>e.id===id)||null;
const validSet=(w,r)=>typeof w==='number'&&isFinite(w)&&w>=0&&w<=1000&&Number.isInteger(r)&&r>=1&&r<=1000;
const EFFS=['easy','normal','hard'];
const cleanEff=x=>EFFS.includes(x)?x:null;
const cleanNote=x=>typeof x==='string'?x.trim().slice(0,200):'';
function applyOpts(t,o){if(!o)return;const e=cleanEff(o.eff),n=cleanNote(o.note);if(e)t.eff=e;else delete t.eff;if(n)t.note=n;else delete t.note;}
function addSet(s,k,entryId,w,r,now=Date.now(),o){const e=findEntry(s,k,entryId);if(!e||!validSet(w,r))return null;const t={id:uid(),weight:w,reps:r,at:now};applyOpts(t,o);e.sets.push(t);return t;}
function updateSet(s,k,entryId,setId,w,r,o){const e=findEntry(s,k,entryId);const t=e&&e.sets.find(x=>x.id===setId);if(!t||!validSet(w,r))return false;t.weight=w;t.reps=r;applyOpts(t,o);return true;}
function dropIfEmpty(s,k){const d=s.days[k];if(d&&!d.entries.length&&!d.comment&&!d.dur&&!d.startAt)delete s.days[k];}
function deleteSet(s,k,entryId,setId){const e=findEntry(s,k,entryId);if(!e)return false;const n=e.sets.length;e.sets=e.sets.filter(x=>x.id!==setId);return e.sets.length<n;}
function deleteEntry(s,k,entryId){const d=s.days[k];if(!d)return false;const n=d.entries.length;d.entries=d.entries.filter(e=>e.id!==entryId);dropIfEmpty(s,k);return d.entries.length<n;}
function dayStats(day){const st={ex:0,sets:0,tonnage:0,minutes:0};if(!day)return st;
for(const e of day.entries){st.ex++;for(const t of e.sets){st.sets++;st.tonnage+=t.weight*t.reps;}}
st.tonnage=Math.round(st.tonnage*10)/10;st.minutes=Number.isInteger(day.dur)?day.dur:0;return st;}
function lastSets(s,exId,beforeKey){const ks=Object.keys(s.days).filter(k=>k<beforeKey).sort().reverse();
for(const k of ks){const e=s.days[k].entries.find(x=>x.exId===exId&&x.sets.length);if(e)return {date:k,sets:e.sets};}return null;}
const e1rm=(w,r)=>r===1?w:Math.round(w*(1+r/30)*10)/10;
const daysInMonth=(y,m)=>new Date(y,m,0).getDate();
function monthGrid(y,m,weekStart=1){const off=(new Date(y,m-1,1).getDay()-weekStart+7)%7;const c=[];for(let i=0;i<off;i++)c.push(null);for(let d=1;d<=daysInMonth(y,m);d++)c.push(y+'-'+pad(m)+'-'+pad(d));return c;}
const hasSets=d=>d.entries.some(e=>e.sets.length);
function workoutDays(s,y,m){const p=y+'-'+pad(m)+'-';return Object.keys(s.days).filter(k=>k.startsWith(p)&&hasSets(s.days[k]));}
function monthsWithData(s,y){const r=new Set();for(const k in s.days)if(k.startsWith(y+'-')&&hasSets(s.days[k]))r.add(+k.slice(5,7));return [...r].sort((a,b)=>a-b);}
function shiftMonth(y,m,n){const d=new Date(y,m-1+n,1);return {y:d.getFullYear(),m:d.getMonth()+1};}
function norm(s){s.custom=Array.isArray(s.custom)?s.custom:[];s.fav=(s.fav&&typeof s.fav==='object'&&!Array.isArray(s.fav))?s.fav:{};s.body=(s.body&&typeof s.body==='object'&&!Array.isArray(s.body))?s.body:{};s.notes=Array.isArray(s.notes)?s.notes.filter(n=>n&&typeof n.id==='string'&&typeof n.text==='string'):[];s.settings=cleanSettings(s.settings);return s;}
function toggleFav(s,id){if(s.fav[id]){delete s.fav[id];return false;}s.fav[id]=true;return true;}
const cleanName=n=>String(n||'').replace(/[<>&"'`|:]/g,'').replace(/\s+/g,' ').trim().slice(0,60);
function addCustom(s,name,eq,group,groups){const n=cleanName(name);if(!n||!groups.includes(group))return null;const q=cleanName(eq)||'другое';
if(s.custom.some(e=>e.group===group&&e.eq===q&&e.name.toLowerCase()===n.toLowerCase()))return null;
const e={id:'c_'+uid(),name:n,eq:q,group,custom:true};s.custom.push(e);return e;}
const fold=x=>String(x).toLowerCase().replace(/ё/g,'е');
function search(list,q){const t=fold(q).split(/\s+/).filter(Boolean);if(!t.length)return [];return list.filter(e=>{const h=fold(e.name+' '+e.eq);return t.every(w=>h.includes(w));});}
function workoutList(s,excl,limit=20){return Object.keys(s.days).filter(k=>k!==excl&&s.days[k].entries.length).sort().reverse().slice(0,limit);}
function copyDay(s,from,to,withSets,now=Date.now()){const src=s.days[from];if(!src||from===to)return 0;let n=0;
for(const e of src.entries){const ex=s.days[to]&&s.days[to].entries.find(x=>x.exId===e.exId);
if(ex&&(!withSets||!e.sets.length))continue;
const t=ex||addEntry(s,to,e.exId);
if(withSets)for(const q of e.sets)t.sets.push({id:uid(),weight:q.weight,reps:q.reps,at:now});
n++;}
return n;}
function summarizeSets(sets,max=6){const f=n=>String(+Number(n).toFixed(2));const a=sets.slice(0,max).map(t=>f(t.weight)+'×'+t.reps).join(', ');return sets.length>max?a+' … (+'+(sets.length-max)+')':a;}
const DK=/^\d{4}-\d{2}-\d{2}$/,IDR=/^[\w-]{1,40}$/;
const okStr=x=>typeof x==='string'&&x.length>0&&x.length<=80&&!/[<>&"'`]/.test(x);
function sanitize(raw,groups){if(!raw||typeof raw!=='object'||raw.v!==1||!raw.days||typeof raw.days!=='object'||Array.isArray(raw.days))return null;const out=emptyState();
for(const k of Object.keys(raw.days)){if(!DK.test(k))continue;const d=raw.days[k];if(!d||!Array.isArray(d.entries))continue;const es=[];
for(const e of d.entries){if(!e||!IDR.test(e.id)||!okStr(e.exId)||!Array.isArray(e.sets))continue;const ss=[];
for(const t of e.sets){if(!t||!IDR.test(t.id)||!validSet(t.weight,t.reps))continue;{const o={id:t.id,weight:t.weight,reps:t.reps,at:Number.isFinite(t.at)?t.at:0};const ef=cleanEff(t.eff),nt=cleanNote(t.note);if(ef)o.eff=ef;if(nt)o.note=nt;ss.push(o);}}
es.push({id:e.id,exId:e.exId,sets:ss});}
const cm=typeof d.comment==='string'?d.comment.trim().slice(0,500):'';const du=Number.isInteger(d.dur)&&d.dur>=1&&d.dur<=1439?d.dur:0;const startAt=Number.isFinite(d.startAt)&&d.startAt>0?d.startAt:0;if(es.length||cm||du||startAt){const o2={entries:es};if(cm)o2.comment=cm;if(du)o2.dur=du;if(startAt)o2.startAt=startAt;if(du&&parseHM(d.t0)!==null&&parseHM(d.t1)!==null){o2.t0=hm(d.t0);o2.t1=hm(d.t1);}out.days[k]=o2;}}
if(Array.isArray(raw.custom))for(const c of raw.custom){if(!c||!IDR.test(c.id))continue;const n=cleanName(c.name);if(!n)continue;out.custom.push({id:c.id,name:n,eq:cleanName(c.eq)||'другое',group:groups.includes(c.group)?c.group:'core',custom:true});}
if(raw.fav&&typeof raw.fav==='object'&&!Array.isArray(raw.fav))for(const k of Object.keys(raw.fav))if(raw.fav[k]===true&&okStr(k))out.fav[k]=true;
if(Array.isArray(raw.notes))for(const n of raw.notes){if(!n||!IDR.test(n.id)||typeof n.text!=='string'||!n.text.trim())continue;out.notes.push({id:n.id,text:n.text.slice(0,5000),at:Number.isFinite(n.at)?n.at:0});}
out.settings=cleanSettings(raw.settings);
if(raw.body&&typeof raw.body==='object'&&!Array.isArray(raw.body))for(const k of Object.keys(raw.body)){if(!DK.test(k))continue;const d=raw.body[k];if(!d||typeof d!=='object')continue;const o={};for(const t of MEASURE_TYPES)if(validMeasureFor(t,d[t]))o[t]=Math.round(d[t]*10)/10;if(Object.keys(o).length)out.body[k]=o;}
if(Number.isFinite(raw.backupAt))out.backupAt=raw.backupAt;
return out;}
function stats(s){let days=0,sets=0;for(const k in s.days){const n=s.days[k].entries.reduce((a,e)=>a+e.sets.length,0);if(n){days++;sets+=n;}}return {days,sets,custom:s.custom.length};}
const exportJSON=(s,name,profile={})=>JSON.stringify({app:'gym-diary',version:1,exportedAt:new Date().toISOString(),profile:name?cleanProfName(name):undefined,sex:cleanSex(profile.sex),age:cleanAge(profile.age),data:s});

const BASE=[
['bench_bb','Жим лежа','штанга','chest'],['bench_db','Жим лежа','гантели','chest'],['incline_bb','Жим лежа (наклон)','штанга','chest'],['incline_db','Жим лежа (наклон)','гантели','chest'],['fly_db','Разведение','гантели','chest'],['pushup','Отжимания','свой вес','chest'],
['row_bb','Тяга в наклоне','штанга','back'],['row_db','Тяга одной гантели','гантель','back'],['pullup','Подтягивания','свой вес','back'],['lat_pull','Тяга верхнего блока','блок','back'],
['squat_bb','Приседания','штанга','legs'],['legpress','Жим ногами','тренажёр','legs'],['rdl_bb','Румынская тяга','штанга','legs'],
['ohp_bb','Жим стоя','штанга','shoulders'],['lateral_db','Подъём в стороны','гантели','shoulders'],
['curl_bb','Сгибание рук','штанга','arms'],['curl_db','Сгибание рук','гантели','arms'],['tri_pushdown','Разгибание на трицепс','блок','arms'],
['plank','Планка','свой вес','core'],['crunch','Скручивания','свой вес','core']
].map(a=>({id:a[0],name:a[1],eq:a[2],group:a[3]}));
// Буквы = оборудование; пары имя+оборудование, уже естьв BASE, не дублируются (старые id остаются прежними)
const EQ={b:'штанга',d:'гантели',o:'гантель',m:'тренажёр',c:'блок',w:'свой вес',k:'гиря',e:'эспандер',s:'смит',z:'EZ-гриф',t:'TRX',r:'рычажный',h:'трэп-гриф'};
const SPEC={
chest:'Жим лежа:bdm|Жим лежа (наклон):bdm|Жим лежа (голова вниз):bd|Разведение:dmc|Сведение рук (бабочка):m|Кроссовер:c|Отжимания:w|Отжимания на брусьях:w|Пулловер:do',
back:'Тяга в наклоне:bdm|Тяга одной гантели:o|Тяга Т-грифа:b|Тяга нижнего блока:c|Тяга в тренажёре:m|Тяга верхнего блока:c|Подтягивания:w|Подтягивания обратным хватом:w|Становая тяга:bd|Гиперэкстензия:w|Шраги:bd|Пуловер прямыми руками:c',
legs:'Приседания:bdkmw|Фронтальные приседания:b|Жим ногами:m|Выпады:bdw|Болгарские сплит-приседания:bd|Румынская тяга:bd|Разгибание ног:m|Сгибание ног:m|Ягодичный мост:bw|Подъём на носки:bmw|Гак-приседания:m',
shoulders:'Жим стоя:bd|Жим сидя:dm|Жим Арнольда:d|Подъём в стороны:dc|Подъём перед собой:bdc|Разведение в наклоне:dc|Тяга к подбородку:bc|Махи в тренажёре:m|Тяга к лицу:c',
arms:'Сгибание рук:bdce|Сгибание на скамье Скотта:bdm|Молотки:d|Концентрированный подъём:o|Разгибание на трицепс:ce|Французский жим:bd|Жим узким хватом:b|Разгибание из-за головы:dc|Отжимания на брусьях (трицепс):w|Сгибание запястий:bd',
core:'Планка:w|Боковая планка:w|Скручивания:wc|Подъём ног в висе:w|Подъём ног лёжа:w|Русские скручивания:wo|Ролик для пресса:w|Велосипед:w',
full:'Бёрпи:w|Махи гирей:k|Рывок гири:k|Турецкий подъём:k|Толчок штанги:b|Трастеры:bd|Прогулка фермера:dk',
cardio:'Беговая дорожка:m|Велотренажёр:m|Эллипс:m|Гребной тренажёр:m|Скакалка:w|Ходьба:w'};
const SPEC2={
chest:'Жим лежа:sr|Жим лежа (наклон):sr|Жим лежа (голова вниз):s|Жим от груди сидя:mr|Разведение на наклонной скамье:d|Кроссовер снизу вверх:c|Кроссовер сверху вниз:c|Жим гантелей нейтральным хватом:d|Отжимания узким хватом:w|Отжимания с ногами на возвышении:w|Отжимания:t|Жим лёжа с пола:bd',
back:'Тяга в наклоне:s|Тяга Пендлея:b|Тяга горизонтального блока узким хватом:c|Тяга горизонтального блока широким хватом:c|Тяга верхнего блока узким хватом:c|Тяга верхнего блока обратным хватом:c|Тяга верхнего блока одной рукой:c|Подтягивания широким хватом:w|Подтягивания нейтральным хватом:w|Австралийские подтягивания:wt|Тяга в рычажном тренажёре:r|Тяга двумя гантелями в наклоне:d|Тяга штанги хватом снизу:b|Становая тяга сумо:b|Становая тяга с трэп-грифом:h|Становая тяга на прямых ногах:bd|Шраги:hs|Тяга с упором грудью:dr|Подтягивания лопатками:w',
legs:'Приседания:sr|Приседания с паузой:b|Приседания на скамью:b|Кубковые приседания:dk|Приседания сумо:dk|Фронтальные приседания:s|Выпады:s|Выпады назад:bd|Выпады в ходьбе:bd|Боковые выпады:dw|Зашагивания на скамью:dw|Жим ногами одной ногой:m|Румынская тяга:k|Румынская тяга на одной ноге:d|Сгибание ног лёжа:m|Сгибание ног сидя:m|Сгибание ног стоя:m|Разгибание ног одной ногой:m|Хип-траст:bdm|Отведение ноги:cm|Сведение ног:m|Разведение ног:m|Подъём на носки сидя:md|Подъём на носки на одной ноге:dw|Приседания пистолетик:w|Прыжки на платформу:w|Приседания с выпрыгиванием:w|Нордические сгибания:w|Приседания у стены:w',
shoulders:'Жим стоя:s|Жим сидя:bs|Жим от плеч в рычажном тренажёре:r|Подъём в стороны одной рукой:c|Подъём в стороны сидя:d|Обратное разведение:mc|Тяга к подбородку:zd|Жим одной рукой:ok|Жим в стойке у стены:w|Швунг жимовой:bd|Тяга к лицу:e|Подъём в стороны:e',
arms:'Сгибание рук:zt|Молотки:c|Сгибание на скамье Скотта:z|Сгибание на наклонной скамье:d|Сгибание Зоттмана:d|Сгибание обратным хватом:bz|Сгибание рук в кроссовере:c|Французский жим:z|Разгибание с канатом:c|Разгибание в наклоне:d|Отжимания от скамьи:w|Отжимания алмазные:w|Жим узким хватом:sz|Разгибание в тренажёре:mr|Сгибание в тренажёре:mr|Сгибание запястий обратным хватом:bd|Вис на перекладине:w',
core:'Скручивания:m|Скручивания на наклонной скамье:w|Обратные скручивания:w|Подъём ног в упоре на локтях:w|Подъём коленей в висе:w|Складной нож:w|Скалолаз:w|Планка на прямых руках:w|Планка с касанием плеч:w|Мёртвый жук:w|Боковые наклоны:d|Дровосек:c|Паллоф-пресс:ce|Лодочка:w|Супермен:w|Планка:t|Пила в планке:t|Вакуум живота:w',
full:'Подъём штанги на грудь:b|Рывок штанги:b|Бёрпи с отжиманием:w|Прыжки «звёздочка»:w|Выпрыгивания:w|Толчок гирь:k|Трастер с гирей:k|Чистка гири:k|Круг с гирей:k|Прогулка фермера:h|Толкание саней:m|Медвежья ходьба:w',
cardio:'Ходьба в горку:m|Степпер:m|Лыжный тренажёр:m|Эйр-байк:m|Плавание:w|Бег:w|Велопрогулка:w|Двойные прыжки на скакалке:w|Интервальный бег:w|Подъём по лестнице:w'};
const have=new Set(BASE.map(e=>e.name+'|'+e.eq));
const CATALOG=BASE.slice();
for(const SP of [SPEC,SPEC2])for(const g in SP)for(const it of SP[g].split('|')){const [n,q]=it.split(':');for(const c of q){const eq=EQ[c];if(!have.has(n+'|'+eq)){have.add(n+'|'+eq);CATALOG.push({id:g+':'+n+'|'+eq,name:n,eq,group:g});}}}
const EX={};
function rebuildEx(){for(const k in EX)delete EX[k];for(const e of CATALOG.concat(S.custom))EX[e.id]=e;}
const MEMS=new Map();
const ls={get(k){try{const v=localStorage.getItem(k);return v===null&&MEMS.has(k)?MEMS.get(k):v;}catch(e){return MEMS.has(k)?MEMS.get(k):null;}},set(k,v){try{localStorage.setItem(k,v);MEMS.delete(k);return true;}catch(e){MEMS.set(k,v);return false;}},remove(k){try{localStorage.removeItem(k);}catch(e){}MEMS.delete(k);},keys(){const r=[];try{for(let i=0;i<localStorage.length;i++)r.push(localStorage.key(i));}catch(e){}return r;}};
let PR=null;
const pkey=id=>'gym:p:'+id;
function loadProfile(id){return Core.parse(ls.get(pkey(id)));}
function boot(){PR=Core.parseProfiles(ls.get('gym:profiles'));let st=null;
if(!PR){const found=ls.keys().filter(k=>k.startsWith('gym:p:')).map(k=>k.slice(6));
if(found.length)PR=Core.rebuildRegistry(found);
if(!PR){const m=Core.migrateLegacy(ls.get('gym:state'));PR=m.reg;st=m.state;ls.set(pkey(PR.activeId),JSON.stringify(st));}
ls.set('gym:profiles',JSON.stringify(PR));}
st=st||loadProfile(PR.activeId);let gs=null;try{gs=JSON.parse(ls.get('gym:settings')||'null');}catch(e){}
st.settings=Core.cleanSettings(gs||st.settings);return st;}
function saveReg(){ls.set('gym:profiles',JSON.stringify(PR));}


let S=boot(),cur=Core.dateKey(new Date());rebuildEx();
function save(){const d=S.days[cur];if(d&&Number.isFinite(d.startAt)){const mins=Math.floor((Date.now()-d.startAt)/60000);if(mins>=1&&mins<=1439)d.dur=mins;}const a=ls.set(pkey(PR.activeId),JSON.stringify(S)),b=ls.set('gym:settings',JSON.stringify(S.settings));if(!a||!b)toast('Не удалось сохранить: хранилище браузера недоступно');}
function toast(t,ok){const el=document.getElementById('toast');el.textContent=t;el.style.background=ok?'var(--ac)':'';el.style.color=ok?'var(--acx)':'';el.style.display='block';setTimeout(()=>el.style.display='none',3500);}
const $=id=>document.getElementById(id);
const fmt=n=>String(+Number(n).toFixed(2));
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function label(k){const t=Core.dateKey(new Date());if(k===t)return 'Сегодня';if(k===Core.shiftDay(t,-1))return 'Вчера';if(k===Core.shiftDay(t,1))return 'Завтра';
const [y,m,d]=k.split('-').map(Number);return d+' '+MON[m-1]+(y!==new Date().getFullYear()?' '+y:'');}
function render(){
const day=S.days[cur],st=Core.dayStats(day),isT=cur===Core.dateKey(new Date());
const [y,m,d]=cur.split('-').map(Number);
$('today').textContent=label(cur);$('today').className='today'+(isT?'':' past');$('today').title=WD[new Date(y,m-1,d).getDay()];
$('sum').innerHTML=st.ex?st.ex+' упр · '+st.sets+' подх · '+fmt(st.tonnage)+' кг · <button class="tmb" id="durb" aria-label="Время тренировки">⏱ '+(day&&day.startAt&&cur===Core.dateKey(new Date())?Core.fmtDur(Math.max(1,Math.floor((Date.now()-day.startAt)/60000))):(st.minutes?Core.fmtDur(st.minutes):'время'))+'</button>':'';
const gs=[];if(day)for(const e of day.entries){const g=EX[e.exId]&&EX[e.exId].group;if(g&&!gs.includes(g))gs.push(g);}
$('tags').innerHTML=gs.map(g=>'<span style="color:'+GROUPS[g].c+'">'+GROUPS[g].n+'</span>').join('');
renderProf();
$('mus').style.display=st.sets?'block':'none';
$('cmt').textContent=(day&&day.comment)?'💬 '+day.comment:'💬 Добавить комментарий';
const L=$('list');
if(!day||!day.entries.length){L.innerHTML='<div class="empty">В этот день записей нет.<br>Нажмите «+», чтобы добавить упражнение.</div>';return;}
L.innerHTML=day.entries.map(e=>{const x=EX[e.exId]||{name:'Упражнение',eq:'',group:'core'};
return '<section class="card" data-entry="'+e.id+'" style="--gc:'+GROUPS[x.group].c+'"><div class="ch"><div><h3>'+x.name+'</h3><small>'+x.eq+'</small></div><div style="display:flex;gap:6px"><button class="drag-handle" data-drag="'+e.id+'" aria-label="Переместить упражнение" title="Зажмите и перетащите">☷</button><button class="ib" data-xi="'+e.exId+'" aria-label="Описание упражнения">?</button><button class="ib" data-add="'+e.id+'" aria-label="Добавить подход">+</button><button class="ib" data-rm="'+e.id+'" aria-label="Убрать упражнение">🗑</button></div></div><div class="sets">'+
e.sets.map(t=>'<button class="set" data-ed="'+e.id+'|'+t.id+'">'+(e.sets.some(q=>q.eff||q.note)?'<span class="mk">'+(t.eff&&EFF[t.eff]?'<i class="dot" style="background:'+EFF[t.eff][1]+'"></i>':'')+(t.note?'💬':'')+'</span>':'')+'<b>'+fmt(t.weight)+'</b> <span>кг</span><br><b>'+t.reps+'</b> <span>пвт</span></button>').join('')+(e.sets.length?'':cardHint(e))+'</div></section>';}).join('');
}
function open(html){tsOpen=false;$('sheet').innerHTML=html;$('ov').classList.add('on');}
function close(){tsOpen=false;$('ov').classList.remove('on');}
function setSheet(entryId,setId){
const e=Core.findEntry(S,cur,entryId);if(!e)return;const t=setId&&e.sets.find(x=>x.id===setId);
let w=20,r=10;
if(t){w=t.weight;r=t.reps;}else if(e.sets.length){const p=e.sets[e.sets.length-1];w=p.weight;r=p.reps;}
else{const p=Core.lastSets(S,e.exId,cur);if(p){const q=p.sets[0];w=q.weight;r=q.reps;}}
const x=EX[e.exId];let ef=(t&&t.eff)||null;const nt0=(t&&t.note)||'';
open('<h2>'+x.name+' · '+x.eq+'</h2>'+lastHint(e)+'<div class="row"><label>Вес, кг</label><button class="st" data-st="w-">−</button><input id="w" type="number" inputmode="decimal" step="0.5" value="'+fmt(w)+'"><button class="st" data-st="w+">+</button></div><div class="row"><label>Повторения</label><button class="st" data-st="r-">−</button><input id="r" type="number" inputmode="numeric" step="1" value="'+r+'"><button class="st" data-st="r+">+</button></div>'+effRow(ef,nt0)+'<div class="btns">'+(t?'<button class="del" id="sdel">Удалить</button>':'<button id="scan">Отмена</button>')+'<button class="ok" id="sok">'+(t?'Сохранить':'Добавить')+'</button></div>');
$('sheet').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;
if(b.dataset.ef){ef=ef===b.dataset.ef?null:b.dataset.ef;document.querySelectorAll('[data-ef]').forEach(x=>x.classList.toggle('on',x.dataset.ef===ef));}
else if(b.dataset.st){const k=b.dataset.st,inp=$(k[0]),v=parseFloat(inp.value)||0,step=k[0]==='w'?2.5:1;inp.value=fmt(Math.max(k[0]==='r'?1:0,v+(k[1]==='+'?step:-step)));}
else if(b.id==='scan')close();
else if(b.id==='sdel'){Core.deleteSet(S,cur,entryId,setId);save();close();render();}
else if(b.id==='sok'){const wv=parseFloat($('w').value),rv=parseInt($('r').value,10);
if(!Core.validSet(wv,rv)){toast('Введите вес от 0 и целое число повторений от 1');return;}
const op={eff:ef,note:$('sn').value};if(t)Core.updateSet(S,cur,entryId,setId,wv,rv,op);else{Core.addSet(S,cur,entryId,wv,rv,Date.now(),op);startRest();}save();close();render();}};
}
let pv={v:'groups'},pq='';
const EQS=['штанга','гантели','гантель','тренажёр','блок','гиря','эспандер','смит','EZ-гриф','TRX','рычажный','трэп-гриф','свой вес','другое'];
const allEx=()=>CATALOG.concat(S.custom);
const exRows=l=>l.length?l.map(e=>'<div class="exr"><button class="ex" data-ex="'+e.id+'">'+e.name+' <small>· '+e.eq+(e.custom?' · своё':'')+'</small></button><button class="star" data-xi="'+e.id+'" aria-label="Описание упражнения">?</button><button class="star" data-fav="'+e.id+'" aria-label="Избранное">'+(S.fav[e.id]?'★':'☆')+'</button></div>').join(''):'<div class="empty" style="margin:24px 0">Ничего не найдено</div>';
const backBar=t=>'<div class="back"><button data-back="1" aria-label="Назад">←</button><h2 style="margin:0">'+t+'</h2></div>';
const byName=(a,b)=>(S.fav[b.id]?1:0)-(S.fav[a.id]?1:0)||a.name.localeCompare(b.name,'ru')||a.eq.localeCompare(b.eq,'ru');
function fillPl(){let h='';
if(pq.trim())h=exRows(Core.search(allEx(),pq).sort(byName).slice(0,60));
else if(pv.v==='groups')h='<div class="gg" style="margin-bottom:10px"><button class="gb" data-v="fav">★ Избранное</button><button class="gb" data-v="recent">🕘 Недавние</button><button class="gb" data-v="fromday" style="grid-column:span 2">📋 Из другого дня</button></div><div class="gg">'+Object.keys(GROUPS).map(k=>'<button class="gb" style="--gc:'+GROUPS[k].c+'" data-g="'+k+'">'+GROUPS[k].n+'</button>').join('')+'</div><button class="ex" data-v="new" style="margin-top:14px;text-align:center">+ Своё упражнение</button>';
else if(pv.v==='group'){const g=pv.g,l=allEx().filter(e=>e.group===g),eqs=[...new Set(l.map(e=>e.eq))].sort((a,b)=>EQS.indexOf(a)-EQS.indexOf(b));
h=backBar('<span style="color:'+GROUPS[g].c+'">'+GROUPS[g].n+'</span>')+'<div class="chips">'+['',...eqs].map(q=>'<button class="chip'+(pv.eq===q?' on':'')+'" data-eq="'+q+'">'+(q||'Все')+'</button>').join('')+'</div>'+exRows(l.filter(e=>!pv.eq||e.eq===pv.eq).sort(byName));}
else if(pv.v==='fav')h=backBar('★ Избранное')+exRows(allEx().filter(e=>S.fav[e.id]).sort(byName));
else if(pv.v==='recent')h=backBar('🕘 Недавние')+exRows(Core.recentIds(S).map(i=>EX[i]).filter(Boolean));
else if(pv.v==='fromday'){const l=Core.workoutList(S,cur,20);

let dragEntryId=null,dragPointer=null,dragClientY=null,dragClientX=null;
function moveDraggedCard(){if(!dragEntryId)return;const source=$('list').querySelector('.card[data-entry="'+dragEntryId+'"]');const target=document.elementFromPoint(dragClientX,dragClientY)?.closest('.card[data-entry]');if(!source||!target||source===target)return;const r=target.getBoundingClientRect();if(dragClientY<r.top+r.height/2)$('list').insertBefore(source,target);else $('list').insertBefore(source,target.nextSibling);}
function dragAutoScroll(){if(!dragEntryId)return;const edge=82;let speed=0;if(dragClientY<edge)speed=-Math.ceil((edge-dragClientY)/5);else if(dragClientY>window.innerHeight-edge)speed=Math.ceil((dragClientY-(window.innerHeight-edge))/5);if(speed)window.scrollBy(0,Math.max(-18,Math.min(18,speed)));moveDraggedCard();requestAnimationFrame(dragAutoScroll);}
