<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дневник тренировок</title>
<style>
:root{--bg:#f3f4f1;--card:#fff;--chip:#e8eae4;--tx:#1c211b;--mut:#6b7468;--ac:#2f9e55;--acx:#fff;--bd:#dcdfd7;--dg:#d64545;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141714;--card:#1f2320;--chip:#2c312d;--tx:#eef1ec;--mut:#8f998c;--ac:#3fb56a;--acx:#0d1a11;--bd:#2f352f;--dg:#ef6a6a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141714;--card:#1f2320;--chip:#2c312d;--tx:#eef1ec;--mut:#8f998c;--ac:#3fb56a;--acx:#0d1a11;--bd:#2f352f;--dg:#ef6a6a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 "Trebuchet MS","Segoe UI",system-ui,sans-serif;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 12px 6px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav .arr{width:44px;height:44px;border-radius:12px;font-size:22px;color:var(--mut)}
.today{background:var(--ac);color:var(--acx);border-radius:14px;padding:10px 18px;font-weight:700;min-width:150px;text-align:center}
.today.past{background:var(--chip);color:var(--tx)}
.sum{text-align:center;color:var(--mut);margin:10px 0 6px;font-variant-numeric:tabular-nums}
.tags{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-weight:700;min-height:22px}
main{padding:8px 12px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:12px;margin:10px 0;border-left:5px solid var(--gc)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ch h3{margin:0;font-size:17px}.ch small{color:var(--mut)}
.ib{width:40px;height:40px;border-radius:12px;font-size:22px;background:var(--chip)}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.set{background:var(--chip);border-radius:12px;padding:6px 12px;text-align:left;font-variant-numeric:tabular-nums}
.set b{font-size:19px}.set span{color:var(--mut);font-size:13px}
.empty{text-align:center;color:var(--mut);margin:48px 16px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:20px;background:var(--ac);color:var(--acx);font-size:32px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:none;align-items:flex-end}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-height:85%;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
.sheet h2{margin:0 0 12px;font-size:19px}
.row{display:flex;align-items:center;gap:10px;margin:12px 0}
.row label{width:96px;color:var(--mut)}
.row input{flex:1;min-width:0;text-align:center;font:inherit;font-size:24px;font-weight:700;background:var(--chip);color:var(--tx);border:0;border-radius:12px;padding:10px}
.row .st{width:48px;height:48px;border-radius:12px;background:var(--chip);font-size:24px}
.btns{display:flex;gap:10px;margin-top:18px}
.btns button{flex:1;padding:14px;border-radius:14px;background:var(--chip);font-weight:700}
.btns .ok{background:var(--ac);color:var(--acx)}.btns .del{color:var(--dg)}
.grp{margin:14px 0 6px;font-weight:700}
.ex{display:block;width:100%;text-align:left;padding:12px;border-radius:12px;background:var(--chip);margin:6px 0}
.ex small{color:var(--mut)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--dg);color:#fff;padding:10px 16px;border-radius:12px;z-index:30;display:none}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gb{--gc:var(--bd);padding:22px 8px;border-radius:16px;background:var(--chip);font-weight:700;font-size:18px;border-bottom:4px solid var(--gc)}
.gb.has{--gc:var(--ac)}
.back{display:flex;align-items:center;gap:10px;margin-bottom:12px}.back button{width:44px;height:44px;border-radius:12px;background:var(--chip);font-size:22px}
.cm{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.cm .mt{font-weight:700;font-size:19px;padding:10px 14px;border-radius:12px;background:var(--chip)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .wd{color:var(--mut);font-size:13px;padding:4px 0}
.cal button{height:44px;border-radius:12px;position:relative;font-variant-numeric:tabular-nums}
.cal .has::after{content:"";position:absolute;left:50%;bottom:4px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--ac)}
.cal .sel{background:var(--ac);color:var(--acx);font-weight:700}.cal .sel::after{background:var(--acx)}
.cal .tdy{outline:2px solid var(--ac)}
.eff{display:flex;gap:8px;margin:6px 0}.ef{flex:1;padding:10px 4px;border-radius:12px;background:var(--chip);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}.ef i{width:10px;height:10px;border-radius:50%;background:var(--ec)}.ef.on{box-shadow:inset 0 0 0 2px var(--ec)}
.mk{display:block;height:14px;font-size:11px;line-height:14px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.cmt{display:block;margin:6px auto 0;color:var(--mut);font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 8px}
.rest{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:62px;padding:0 8px 0 18px;border-radius:20px;background:var(--card);color:var(--tx);box-shadow:0 6px 18px rgba(0,0,0,.3);display:none;align-items:center;gap:12px;font-weight:700;font-size:20px;z-index:6;font-variant-numeric:tabular-nums}.rest.done{background:var(--ac);color:var(--acx)}.rest button{width:44px;height:44px;border-radius:12px;font-size:18px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.tile{background:var(--chip);border-radius:14px;padding:10px}.tile b{display:block;font-size:21px}.tile small{color:var(--mut)}
.chart{width:100%;height:auto;margin:6px 0}.chart .ln{stroke:var(--ac);fill:none;stroke-width:2.5;stroke-linejoin:round}.chart .dt{fill:var(--ac)}.chart .gr{stroke:var(--bd)}.chart text{fill:var(--mut);font-size:10px}
.tile{position:relative}.tile>small:first-of-type{display:block;padding-right:32px}.qi{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:var(--bd);color:var(--mut);font-weight:700}
.srow{padding:8px 0;border-bottom:1px solid var(--bd)}
.hint{color:var(--mut);margin:-4px 0 8px;font-size:14px}
.exr{display:flex;gap:6px;align-items:stretch}.exr .ex{flex:1;width:auto}.star{width:48px;margin:6px 0;border-radius:12px;background:var(--chip);font-size:22px}
.q{width:100%;font:inherit;font-size:17px;background:var(--chip);color:var(--tx);border:0;border-radius:12px;padding:12px;margin-bottom:12px}
.row select{flex:1;min-width:0;font:inherit;font-size:17px;background:var(--chip);color:var(--tx);border:0;border-radius:12px;padding:12px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:8px;padding-bottom:4px}.chip{flex:none;padding:8px 14px;border-radius:20px;background:var(--chip)}.chip.on{background:var(--ac);color:var(--acx);font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<header>
 <div class="nav"><button class="arr" id="menubtn" aria-label="Меню">☰</button><button class="today" id="today"></button><button class="arr" id="calbtn" aria-label="Календарь">📅</button></div>
 <div class="sum" id="sum"></div><div class="tags" id="tags"></div><button class="cmt" id="cmt"></button>
</header>
<main id="list"></main>
<button class="fab" id="add" aria-label="Добавить упражнение">+</button>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<div class="rest" id="rest"></div>
<div class="toast" id="toast"></div>

<script id="core">
/*CORE*/
const Core=(()=>{
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const pad=n=>String(n).padStart(2,'0');
const dateKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const shiftDay=(k,n)=>{const [y,m,d]=k.split('-').map(Number);return dateKey(new Date(y,m-1,d+n));};
const DEF={theme:'auto',weekStart:1,rest:0,keepAwake:false};
const emptyState=()=>({v:1,days:{},custom:[],fav:{},body:{},notes:[],settings:{...DEF}});
function parse(raw){try{const s=JSON.parse(raw);if(s&&s.v===1&&s.days&&typeof s.days==='object'&&!Array.isArray(s.days))return norm(s);}catch(e){}return emptyState();}
const getDay=(s,k)=>s.days[k]||(s.days[k]={entries:[]});
function addEntry(s,k,exId){const d=getDay(s,k);let e=d.entries.find(x=>x.exId===exId);if(!e){e={id:uid(),exId,sets:[]};d.entries.push(e);}return e;}
const findEntry=(s,k,id)=>(s.days[k]?s.days[k].entries:[]).find(e=>e.id===id)||null;
const validSet=(w,r)=>typeof w==='number'&&isFinite(w)&&w>=0&&w<=1000&&Number.isInteger(r)&&r>=1&&r<=1000;
const EFFS=['easy','normal','hard'];
const cleanEff=x=>EFFS.includes(x)?x:null;
const cleanNote=x=>typeof x==='string'?x.trim().slice(0,200):'';
function applyOpts(t,o){if(!o)return;const e=cleanEff(o.eff),n=cleanNote(o.note);if(e)t.eff=e;else delete t.eff;if(n)t.note=n;else delete t.note;}
function addSet(s,k,entryId,w,r,now=Date.now(),o){const e=findEntry(s,k,entryId);if(!e||!validSet(w,r))return null;const t={id:uid(),weight:w,reps:r,at:now};applyOpts(t,o);e.sets.push(t);return t;}
function updateSet(s,k,entryId,setId,w,r,o){const e=findEntry(s,k,entryId);const t=e&&e.sets.find(x=>x.id===setId);if(!t||!validSet(w,r))return false;t.weight=w;t.reps=r;applyOpts(t,o);return true;}
function dropIfEmpty(s,k){const d=s.days[k];if(d&&!d.entries.length&&!d.comment)delete s.days[k];}
function deleteSet(s,k,entryId,setId){const e=findEntry(s,k,entryId);if(!e)return false;const n=e.sets.length;e.sets=e.sets.filter(x=>x.id!==setId);return e.sets.length<n;}
function deleteEntry(s,k,entryId){const d=s.days[k];if(!d)return false;const n=d.entries.length;d.entries=d.entries.filter(e=>e.id!==entryId);dropIfEmpty(s,k);return d.entries.length<n;}
function dayStats(day){const st={ex:0,sets:0,tonnage:0,minutes:0};if(!day)return st;let lo=Infinity,hi=-Infinity;
for(const e of day.entries){st.ex++;for(const t of e.sets){st.sets++;st.tonnage+=t.weight*t.reps;lo=Math.min(lo,t.at);hi=Math.max(hi,t.at);}}
st.tonnage=Math.round(st.tonnage*10)/10;if(st.sets>1)st.minutes=Math.max(1,Math.round((hi-lo)/60000));return st;}
function lastSets(s,exId,beforeKey){const ks=Object.keys(s.days).filter(k=>k<beforeKey).sort().reverse();
for(const k of ks){const e=s.days[k].entries.find(x=>x.exId===exId&&x.sets.length);if(e)return {date:k,sets:e.sets};}return null;}
const e1rm=(w,r)=>r===1?w:Math.round(w*(1+r/30)*10)/10;
const daysInMonth=(y,m)=>new Date(y,m,0).getDate();
function monthGrid(y,m,weekStart=1){const off=(new Date(y,m-1,1).getDay()-weekStart+7)%7;const c=[];for(let i=0;i<off;i++)c.push(null);for(let d=1;d<=daysInMonth(y,m);d++)c.push(y+'-'+pad(m)+'-'+pad(d));return c;}
const hasSets=d=>d.entries.some(e=>e.sets.length);
function workoutDays(s,y,m){const p=y+'-'+pad(m)+'-';return Object.keys(s.days).filter(k=>k.startsWith(p)&&hasSets(s.days[k]));}
function monthsWithData(s,y){const r=new Set();for(const k in s.days)if(k.startsWith(y+'-')&&hasSets(s.days[k]))r.add(+k.slice(5,7));return [...r].sort((a,b)=>a-b);}
function shiftMonth(y,m,n){const d=new Date(y,m-1+n,1);return {y:d.getFullYear(),m:d.getMonth()+1};}
function norm(s){s.custom=Array.isArray(s.custom)?s.custom:[];s.fav=(s.fav&&typeof s.fav==='object'&&!Array.isArray(s.fav))?s.fav:{};s.body=(s.body&&typeof s.body==='object'&&!Array.isArray(s.body))?s.body:{};s.notes=Array.isArray(s.notes)?s.notes.filter(n=>n&&typeof n.id==='string'&&typeof n.text==='string'):[];s.settings=cleanSettings(s.settings);return s;}
function toggleFav(s,id){if(s.fav[id]){delete s.fav[id];return false;}s.fav[id]=true;return true;}
const cleanName=n=>String(n||'').replace(/[<>&"'`|:]/g,'').replace(/\s+/g,' ').trim().slice(0,60);
function addCustom(s,name,eq,group,groups){const n=cleanName(name);if(!n||!groups.includes(group))return null;const q=cleanName(eq)||'другое';
if(s.custom.some(e=>e.group===group&&e.eq===q&&e.name.toLowerCase()===n.toLowerCase()))return null;
const e={id:'c_'+uid(),name:n,eq:q,group,custom:true};s.custom.push(e);return e;}
const fold=x=>String(x).toLowerCase().replace(/ё/g,'е');
function search(list,q){const t=fold(q).split(/\s+/).filter(Boolean);if(!t.length)return [];return list.filter(e=>{const h=fold(e.name+' '+e.eq);return t.every(w=>h.includes(w));});}
function workoutList(s,excl,limit=20){return Object.keys(s.days).filter(k=>k!==excl&&s.days[k].entries.length).sort().reverse().slice(0,limit);}
function copyDay(s,from,to,withSets,now=Date.now()){const src=s.days[from];if(!src||from===to)return 0;let n=0;
for(const e of src.entries){const ex=s.days[to]&&s.days[to].entries.find(x=>x.exId===e.exId);
if(ex&&(!withSets||!e.sets.length))continue;
const t=ex||addEntry(s,to,e.exId);
if(withSets)for(const q of e.sets)t.sets.push({id:uid(),weight:q.weight,reps:q.reps,at:now});
n++;}
return n;}
function summarizeSets(sets,max=6){const f=n=>String(+Number(n).toFixed(2));const a=sets.slice(0,max).map(t=>f(t.weight)+'×'+t.reps).join(', ');return sets.length>max?a+' … (+'+(sets.length-max)+')':a;}
const DK=/^\d{4}-\d{2}-\d{2}$/,IDR=/^[\w-]{1,40}$/;
const okStr=x=>typeof x==='string'&&x.length>0&&x.length<=80&&!/[<>&"'`]/.test(x);
function sanitize(raw,groups){if(!raw||typeof raw!=='object'||raw.v!==1||!raw.days||typeof raw.days!=='object'||Array.isArray(raw.days))return null;const out=emptyState();
for(const k of Object.keys(raw.days)){if(!DK.test(k))continue;const d=raw.days[k];if(!d||!Array.isArray(d.entries))continue;const es=[];
for(const e of d.entries){if(!e||!IDR.test(e.id)||!okStr(e.exId)||!Array.isArray(e.sets))continue;const ss=[];
for(const t of e.sets){if(!t||!IDR.test(t.id)||!validSet(t.weight,t.reps))continue;{const o={id:t.id,weight:t.weight,reps:t.reps,at:Number.isFinite(t.at)?t.at:0};const ef=cleanEff(t.eff),nt=cleanNote(t.note);if(ef)o.eff=ef;if(nt)o.note=nt;ss.push(o);}}
es.push({id:e.id,exId:e.exId,sets:ss});}
const cm=typeof d.comment==='string'?d.comment.trim().slice(0,500):'';if(es.length||cm){out.days[k]={entries:es};if(cm)out.days[k].comment=cm;}}
if(Array.isArray(raw.custom))for(const c of raw.custom){if(!c||!IDR.test(c.id))continue;const n=cleanName(c.name);if(!n)continue;out.custom.push({id:c.id,name:n,eq:cleanName(c.eq)||'другое',group:groups.includes(c.group)?c.group:'core',custom:true});}
if(raw.fav&&typeof raw.fav==='object'&&!Array.isArray(raw.fav))for(const k of Object.keys(raw.fav))if(raw.fav[k]===true&&okStr(k))out.fav[k]=true;
if(Array.isArray(raw.notes))for(const n of raw.notes){if(!n||!IDR.test(n.id)||typeof n.text!=='string'||!n.text.trim())continue;out.notes.push({id:n.id,text:n.text.slice(0,5000),at:Number.isFinite(n.at)?n.at:0});}
out.settings=cleanSettings(raw.settings);
if(raw.body&&typeof raw.body==='object'&&!Array.isArray(raw.body))for(const k of Object.keys(raw.body)){if(!DK.test(k))continue;const d=raw.body[k];if(!d||typeof d!=='object')continue;const o={};for(const t of MEASURE_TYPES)if(validMeasureFor(t,d[t]))o[t]=Math.round(d[t]*10)/10;if(Object.keys(o).length)out.body[k]=o;}
if(Number.isFinite(raw.backupAt))out.backupAt=raw.backupAt;
return out;}
function stats(s){let days=0,sets=0;for(const k in s.days){const n=s.days[k].entries.reduce((a,e)=>a+e.sets.length,0);if(n){days++;sets+=n;}}return {days,sets,custom:s.custom.length};}
const exportJSON=s=>JSON.stringify({app:'gym-diary',version:1,exportedAt:new Date().toISOString(),data:s});
function importText(text,groups){let o;try{o=JSON.parse(text);}catch(e){return {ok:false,error:'Это не похоже на копию дневника: текст не читается'};}
if(o&&o.app==='gym-diary'&&o.data)o=o.data;const st=sanitize(o,groups);if(!st)return {ok:false,error:'Это не похоже на копию дневника'};
const k=stats(st);if(!k.days&&!k.custom&&!extraCount(st))return {ok:false,error:'В копии нет записей'};return {ok:true,state:st};}
function mergeStates(a,b){const o=JSON.parse(JSON.stringify(a));
for(const k of Object.keys(b.days)){const d=getDay(o,k);if(b.days[k].comment&&!d.comment)d.comment=b.days[k].comment;for(const e of b.days[k].entries){let t=d.entries.find(x=>x.exId===e.exId);if(!t){t={id:e.id,exId:e.exId,sets:[]};d.entries.push(t);}
const have=new Set(t.sets.map(x=>x.id));for(const q of e.sets)if(!have.has(q.id)){t.sets.push({...q});have.add(q.id);}t.sets.sort((x,y)=>x.at-y.at);}}
for(const c of b.custom)if(!o.custom.some(x=>x.id===c.id))o.custom.push({...c});Object.assign(o.fav,b.fav);o.body=o.body||{};o.notes=o.notes||[];for(const n of b.notes||[]){const i=o.notes.findIndex(x=>x.id===n.id);if(i<0)o.notes.push({...n});else if(n.at>o.notes[i].at)o.notes[i]={...n};}for(const k of Object.keys(b.body||{}))o.body[k]=Object.assign({},b.body[k],o.body[k]||{});return o;}
const dayNum=k=>{const [y,m,d]=k.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5);};
function exerciseHistory(s,exId){const out=[];for(const k of Object.keys(s.days).sort()){const sets=[];for(const e of s.days[k].entries)if(e.exId===exId)sets.push(...e.sets);if(!sets.length)continue;
const pool=sets.filter(t=>t.reps<=12);let be=0;for(const t of (pool.length?pool:sets))be=Math.max(be,e1rm(t.weight,t.reps));
out.push({date:k,sets,max:Math.max(...sets.map(t=>t.weight)),e1rm:be,ton:Math.round(sets.reduce((a,t)=>a+t.weight*t.reps,0)*10)/10,maxreps:Math.max(...sets.map(t=>t.reps)),totreps:sets.reduce((a,t)=>a+t.reps,0)});}
return out;}
function exerciseSummary(h){const r={sessions:h.length,sets:0,tonnage:0,reps:0,maxW:null,bestE:null,last:h.length?h[h.length-1].date:null};
for(const d of h){r.sets+=d.sets.length;r.tonnage+=d.ton;r.reps+=d.totreps;for(const t of d.sets)if(!r.maxW||t.weight>r.maxW.value)r.maxW={value:t.weight,reps:t.reps,date:d.date};if(d.e1rm>0&&(!r.bestE||d.e1rm>r.bestE.value))r.bestE={value:d.e1rm,date:d.date};}
r.tonnage=Math.round(r.tonnage*10)/10;return r;}
const periodFrom=(days,today)=>days?shiftDay(today,-days):null;
function series(h,metric,fromKey){return h.filter(d=>!fromKey||d.date>=fromKey).map(d=>({date:d.date,y:d[metric]}));}
function chartLayout(ser,W,H,pad){const {l,r,t,b}=pad,n=ser.length;if(!n)return {points:[],ticks:[]};
const ys=ser.map(p=>p.y),dmin=Math.min(...ys),dmax=Math.max(...ys);let lo=dmin,hi=dmax;if(hi===lo){lo-=1;hi+=1;}else{const m=(hi-lo)*0.12;lo-=m;hi+=m;}if(lo<0&&dmin>=0)lo=0;
const x0=dayNum(ser[0].date),x1=dayNum(ser[n-1].date);
const px=d=>n===1||x1===x0?l+(W-l-r)/2:l+(dayNum(d)-x0)/(x1-x0)*(W-l-r);const py=v=>t+(1-(v-lo)/(hi-lo))*(H-t-b);
const tv=dmax>dmin?[dmin,(dmin+dmax)/2,dmax]:[dmin];
return {points:ser.map(p=>({...p,px:px(p.date),py:py(p.y)})),ticks:tv.map(v=>({v:Math.round(v*10)/10,py:py(v)}))};}
function exercisesWithHistory(s){const m={};for(const k of Object.keys(s.days))for(const e of s.days[k].entries){if(!e.sets.length)continue;const r=m[e.exId]||(m[e.exId]={exId:e.exId,ds:new Set(),last:''});r.ds.add(k);if(k>r.last)r.last=k;}
return Object.values(m).map(r=>({exId:r.exId,sessions:r.ds.size,last:r.last})).sort((a,b)=>b.last.localeCompare(a.last)||b.sessions-a.sessions);}
const MEASURE_TYPES=['weight','chest','waist','hips','biceps','thigh','fat'];
const validMeasureFor=(t,v)=>validMeasure(v)&&(t!=='fat'||(v>=2&&v<=60));
const validMeasure=v=>typeof v==='number'&&isFinite(v)&&v>0&&v<=500;
const realDate=k=>typeof k==='string'&&DK.test(k)&&dateKey(new Date(+k.slice(0,4),+k.slice(5,7)-1,+k.slice(8)))===k;
function setMeasure(s,date,type,v){if(!realDate(date)||!MEASURE_TYPES.includes(type)||!validMeasureFor(type,v))return false;s.body=s.body||{};(s.body[date]=s.body[date]||{})[type]=Math.round(v*10)/10;return true;}
function deleteMeasure(s,date,type){const d=s.body&&s.body[date];if(!d||!(type in d))return false;delete d[type];if(!Object.keys(d).length)delete s.body[date];return true;}
function measureSeries(s,type){return Object.keys(s.body||{}).filter(k=>s.body[k][type]!==undefined).sort().map(k=>({date:k,y:s.body[k][type]}));}
function measureSummary(ser){if(!ser.length)return {count:0,latest:null,first:null,delta:null,prevDelta:null,min:null,max:null};const l=ser[ser.length-1],f=ser[0],r=x=>Math.round(x*10)/10,ys=ser.map(p=>p.y);return {count:ser.length,latest:l,first:f,delta:r(l.y-f.y),prevDelta:ser.length>1?r(l.y-ser[ser.length-2].y):null,min:Math.min(...ys),max:Math.max(...ys)};}
function fatBreakdown(s){const f=measureSeries(s,'fat');if(!f.length)return null;const last=f[f.length-1];const w=measureSeries(s,'weight').filter(p=>p.date<=last.date);if(!w.length)return null;const wl=w[w.length-1];if(dayNum(last.date)-dayNum(wl.date)>30)return null;
const fatKg=Math.round(wl.y*last.y/100*10)/10,leanKg=Math.round((wl.y-wl.y*last.y/100)*10)/10;return {date:last.date,fat:last.y,weight:wl.y,weightDate:wl.date,fatKg,leanKg};}
const bodyCount=s=>Object.values(s.body||{}).reduce((a,d)=>a+Object.keys(d).length,0);
function cleanSettings(x){x=x&&typeof x==='object'?x:{};const o={...DEF};if(['auto','light','dark'].includes(x.theme))o.theme=x.theme;if(x.weekStart===0||x.weekStart===1)o.weekStart=x.weekStart;if([0,60,90,120,180,240].includes(x.rest))o.rest=x.rest;if(typeof x.keepAwake==='boolean')o.keepAwake=x.keepAwake;return o;}
function setSetting(s,key,val){if(!(key in DEF))return false;const n=cleanSettings({...s.settings,[key]:val});if(n[key]!==val)return false;s.settings=n;return true;}
function deleteCustom(s,id){const i=s.custom.findIndex(e=>e.id===id);if(i<0)return false;for(const k in s.days)if(s.days[k].entries.some(e=>e.exId===id))return 'used';s.custom.splice(i,1);delete s.fav[id];return true;}
function saveNote(s,id,text,now=Date.now()){const t=String(text||'').trim().slice(0,5000);if(!t)return null;if(id){const n=s.notes.find(x=>x.id===id);if(!n)return null;n.text=t;n.at=now;return n;}const n={id:'n_'+uid(),text:t,at:now};s.notes.push(n);return n;}
function deleteNote(s,id){const n=s.notes.length;s.notes=s.notes.filter(x=>x.id!==id);return s.notes.length<n;}
const sortedNotes=s=>s.notes.slice().sort((a,b)=>b.at-a.at);
function noteTitle(text){const l=String(text).split('\n').map(x=>x.trim()).find(Boolean)||'';return l.length>60?l.slice(0,60)+'…':(l||'Без названия');}
function setComment(s,k,text){if(!realDate(k))return false;const t=String(text||'').trim().slice(0,500);if(t)getDay(s,k).comment=t;else if(s.days[k]){delete s.days[k].comment;dropIfEmpty(s,k);}return true;}
const extraCount=s=>bodyCount(s)+s.notes.length+Object.values(s.days).filter(d=>d.comment).length;
const fmtClock=sec=>Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
function recentIds(s,limit=12){const out=[];for(const k of Object.keys(s.days).sort().reverse()){for(const e of s.days[k].entries.slice().reverse()){if(!out.includes(e.exId))out.push(e.exId);if(out.length>=limit)return out;}}return out;}
return {uid,dateKey,shiftDay,emptyState,parse,getDay,addEntry,findEntry,addSet,updateSet,deleteSet,deleteEntry,dropIfEmpty,dayStats,lastSets,e1rm,validSet,monthGrid,workoutDays,monthsWithData,shiftMonth,norm,toggleFav,cleanName,addCustom,search,recentIds,workoutList,copyDay,summarizeSets,sanitize,stats,exportJSON,importText,mergeStates,exerciseHistory,exerciseSummary,periodFrom,series,chartLayout,exercisesWithHistory,dayNum,MEASURE_TYPES,setMeasure,deleteMeasure,measureSeries,measureSummary,bodyCount,DEF,cleanSettings,setSetting,deleteCustom,saveNote,deleteNote,sortedNotes,noteTitle,setComment,extraCount,fmtClock,EFFS,cleanEff,cleanNote,validMeasureFor,fatBreakdown};
})();
/*ENDCORE*/
</script>

function noteSheet(id){const n=id&&S.notes.find(x=>x.id===id);
open('<div class="back"><button data-back="1" aria-label="Назад">←</button><h2 style="margin:0">'+(n?'Заметка':'Новая заметка')+'</h2></div><textarea id="nta" class="q" rows="10" maxlength="5000" placeholder="Текст заметки…"></textarea><div class="btns">'+(n?'<button class="del" id="ndel">Удалить</button>':'')+'<button class="ok" id="nsv">Сохранить</button></div>');
$('nta').value=n?n.text:'';
$('sheet').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;
if(b.dataset.back)notesSheet();
else if(b.id==='nsv'){if(!Core.saveNote(S,id,$('nta').value)){toast('Введите текст заметки');return;}save();notesSheet();}
else if(b.id==='ndel')ask('Удалить заметку?',()=>{Core.deleteNote(S,id);save();notesSheet();},()=>noteSheet(id));};}
function settingsSheet(){const st=S.settings;
const grp=(t,key,arr)=>'<div class="grp">'+t+'</div><div class="chips" style="flex-wrap:wrap">'+arr.map(a=>'<button class="chip'+(st[key]===a[0]?' on':'')+'" data-sk="'+key+'" data-sv="'+a[0]+'">'+a[1]+'</button>').join('')+'</div>';
open('<div class="back"><button data-back="1" aria-label="Назад">←</button><h2 style="margin:0">Настройки</h2></div>'+grp('Тема','theme',[['auto','Авто'],['light','Светлая'],['dark','Тёмная']])+grp('Первый день недели','weekStart',[[1,'Понедельник'],[0,'Воскресенье']])+grp('Таймер отдыха после подхода','rest',[[0,'Выкл'],[60,'1:00'],[90,'1:30'],[120,'2:00'],[180,'3:00'],[240,'4:00']])+grp('Не гасить экран','keepAwake',[[false,'Выкл'],[true,'Вкл']])+'<button class="ex" data-cs="1" style="margin-top:14px">Свои упражнения</button>');
$('sheet').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset;
if(d.back)menuSheet();else if(d.cs)customSheet();
else if(d.sk){const k=d.sk,v=(k==='theme')?d.sv:(k==='keepAwake')?d.sv==='true':Number(d.sv);if(Core.setSetting(S,k,v)){save();applySettings();if(k==='rest'&&!v)stopRest();settingsSheet();render();}}};}
function customSheet(){
open('<div class="back"><button data-back="1" aria-label="Назад">←</button><h2 style="margin:0">Свои упражнения</h2></div>'+(S.custom.length?S.custom.map(e=>'<div class="srow" style="display:flex;justify-content:space-between;align-items:center"><span>'+e.name+' <small style="color:var(--mut)">· '+e.eq+' · '+(GROUPS[e.group]||{n:''}).n+'</small></span><button class="ib" data-cd="'+e.id+'" aria-label="Удалить">🗑</button></div>').join(''):'<div class="empty" style="margin:24px 0">Своих упражнений пока нет</div>'));
$('sheet').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;const d=b.dataset;if(d.back)settingsSheet();
else if(d.cd)ask('Удалить упражнение?',()=>{const r=Core.deleteCustom(S,d.cd);if(r===true){save();rebuildEx();}else if(r==='used')toast('Упражнение есть в ваших записях: сначала уберите его из тренировок');customSheet();},()=>customSheet());};}
const EFF={easy:['Легко','#3fb56a'],normal:['Нормально','#e6b422'],hard:['Тяжело','#ef5a5a']};
const effRow=(ef,note)=>'<div class="eff">'+Object.keys(EFF).map(k=>'<button class="ef'+(ef===k?' on':'')+'" data-ef="'+k+'" style="--ec:'+EFF[k][1]+'"><i></i>'+EFF[k][0]+'</button>').join('')+'</div><input id="sn" class="q" maxlength="200" placeholder="Комментарий к подходу (необязательно)" value="'+esc(note)+'" style="margin:8px 0 0">';
const GL={
maxw:['Рекорд веса','Самый большой вес, с которым вы сделали подход. Под числом — сколько повторений вы сделали с ним и когда.','Пример: «60 кг, 5 повт.» — вы подняли 60 кг пять раз.'],
e1rm:['1ПМ (расчётный максимум)','Оценка веса, который вы смогли бы поднять один раз. Считается по формуле Эпли: вес × (1 + повторения ÷ 30), по подходам до 12 повторений. Помогает сравнивать подходы с разным числом повторений.','Пример: 55 кг × 8 повторений ≈ 69,7 кг. Это оценка силы, а не обещание, что вы поднимете этот вес.'],
sessions:['Тренировок','Сколько разных дней вы делали это упражнение. Под числом — сколько всего подходов вы выполнили.'],
tonnage:['Тоннаж','Суммарная работа: вес × повторения по всем подходам. Растёт, если вы поднимаете больше или делаете больше повторений и подходов.','Пример: 50×10 + 50×10 + 55×8 = 1440 кг.'],
maxreps:['Рекорд повторений','Максимальное число повторений в одном подходе. Показывается для упражнений со своим весом (отжимания, подтягивания и т.п.).'],
sets:['Подходы','Сколько подходов вы выполнили всего. Подход — серия повторений подряд без отдыха.'],
totreps:['Всего повторений','Сумма повторений по всем подходам. Для упражнений со своим весом это главный показатель объёма.'],
m_max:['График: макс. вес','Самый тяжёлый подход каждой тренировки. Растущая линия — вы становитесь сильнее. Периоды (30 дн., 90 дн., год, всё) ограничивают график последним отрезком времени, а плитки всегда считаются по всей истории.'],
m_e1rm:['График: 1ПМ','Лучшая расчётная сила за тренировку (см. «1ПМ»). Удобен, когда вы меняете число повторений: сравнивает подходы «на равных».'],
m_ton:['График: тоннаж','Общий объём работы за тренировку. Помогает следить за нагрузкой: слишком резкий скачок — повод быть осторожнее.'],
m_maxreps:['График: макс. повторения','Лучший подход тренировки по числу повторений.'],
m_totreps:['График: всего повторений','Сумма повторений за тренировку.'],
cur:['Сейчас','Последнее записанное значение и дата замера.'],
dprev:['К прошлому замеру','Разница между последним и предыдущим замером. Плюс — значение выросло, минус — уменьшилось.'],
dfirst:['С первого замера','Разница между последним и самым первым замером — общий результат за всё время.'],
minmax:['Мин — макс','Наименьшее и наибольшее значение за всё время замеров.'],
bw:['Вес тела','Лучше взвешиваться в одинаковых условиях: утром, после туалета, до еды и воды, в одинаковой одежде. Вес колеблется день ото дня на 0,5–2 кг (вода, еда), поэтому смотрите на тренд, а не на отдельные дни.'],
fat:['Процент жира','Доля жира в общей массе тела. Измеряется весами-анализаторами, калипером (складки кожи), DEXA и др.; разные способы дают разные числа, поэтому сравнивайте только значения, полученные одним способом и в одинаковых условиях.'],
fatkg:['Масса жира','Расчёт: вес тела × % жира ÷ 100. Берётся последний замер жира и ближайший к нему более ранний замер веса (не старше 30 дней). Приблизительная оценка.','Пример: 80 кг и 20% → 16 кг жира.'],
lean:['Сухая масса','Вес тела минус масса жира: мышцы, кости, органы, вода. Приблизительная оценка.','Пример: 80 − 16 = 64 кг.'],
m_meas:['График замеров','Каждая точка — один замер за дату. Линия показывает, куда идёт значение со временем. Периоды сверху ограничивают график последним отрезком.'],
eff:['Оценка подхода','«Легко / Нормально / Тяжело» — ваше ощущение подхода (зелёная, жёлтая, красная точка). Помогает вспомнить, где вы были близки к отказу. Пока в расчёты не входит.']
};
const TK={'Рекорд веса':'maxw','Лучший 1ПМ':'e1rm','Тренировок':'sessions','Тоннаж всего':'tonnage','Рекорд повторений':'maxreps','Всего подходов':'sets','Всего повторений':'totreps','Сейчас':'cur','К прошлому замеру':'dprev','С первого замера':'dfirst','Мин — макс':'minmax','Масса жира':'fatkg','Сухая масса':'lean'};
function glossSheet(key,back){const ks=key?[key]:Object.keys(GL);
open('<div class="back"><button data-back="1" aria-label="Назад">←</button><h2 style="margin:0">'+(key?GL[key][0]:'Словарь терминов')+'</h2></div>'+ks.map(k=>(key?'':'<div class="grp">'+GL[k][0]+'</div>')+'<p>'+GL[k][1]+'</p>'+(GL[k][2]?'<p class="hint">'+GL[k][2]+'</p>':'')).join(''));
$('sheet').onclick=ev=>{if(ev.target.closest('[data-back]'))back();};}
function fbTiles(type){if(type!=='fat')return '';const fb=Core.fatBreakdown(S);if(!fb)return tileH('Масса жира','—','Нужен замер веса');
return tileH('Масса жира',fmt(fb.fatKg)+' кг','при весе '+fmt(fb.weight)+' кг')+tileH('Сухая масса',fmt(fb.leanKg)+' кг','');}
function rmSheet(id){const e=Core.findEntry(S,cur,id);if(!e)return;const x=EX[e.exId]||{name:'Упражнение',eq:''};
open('<h2>Убрать упражнение?</h2><p>'+x.name+' · '+x.eq+'. Будет удалено подходов: '+e.sets.length+'.</p><div class="btns"><button id="rcan">Отмена</button><button class="del" id="rok">Удалить</button></div>');
$('sheet').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;if(b.id==='rok'){Core.deleteEntry(S,cur,id);save();close();render();}else if(b.id==='rcan')close();};}
$('ov').onclick=ev=>{if(ev.target===$('ov'))close();};
$('add').onclick=()=>pickSheet();
$('calbtn').onclick=()=>{cv=null;calSheet();};
$('menubtn').onclick=menuSheet;
$('cmt').onclick=commentSheet;
$('rest').onclick=ev=>{if(ev.target.closest('button'))stopRest();};
applySettings();
$('today').onclick=()=>{cur=Core.dateKey(new Date());render();};
$('list').onclick=ev=>{const b=ev.target.closest('button');if(!b)return;
if(b.dataset.add)setSheet(b.dataset.add,null);
else if(b.dataset.ed){const [a,c]=b.dataset.ed.split('|');setSheet(a,c);}
else if(b.dataset.rm)rmSheet(b.dataset.rm);};
render();
</script>
</body>
</html>
